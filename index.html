<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpecStack — SDLC Document Intelligence Platform</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="wordmark">
      <div class="mark">SPEC<span>STACK</span></div>
      <div class="tag">SDLC Document Intelligence</div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
      <select id="projectSelect"></select>
      <button class="btn btn-sm" id="newProjectBtn">+ New Project</button>
      <button class="btn btn-sm btn-ghost" id="deleteProjectBtn" title="Delete current project">Delete</button>
    </div>
  </div>

  <div class="body-row">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main"></main>
  </div>

</div>

<div class="modal-overlay" id="newProjectModal">
  <div class="modal blueprint-frame"><span class="bl-tr"></span><span class="bl-br"></span>
    <h3>New Project</h3>
    <p>Create a project workspace to track its document catalog.</p>
    <input type="text" id="newProjectName" placeholder="Project name (e.g. Ledger — Credit Repair Platform)">
    <input type="text" id="newProjectClient" placeholder="Client / customer (optional)">
    <div class="modal-actions">
      <button class="btn btn-sm" id="cancelNewProject">Cancel</button>
      <button class="btn btn-sm btn-primary" id="confirmNewProject">Create</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
